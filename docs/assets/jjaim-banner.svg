<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="244" viewBox="0 0 1040 244" role="img" aria-labelledby="title description">
  <title id="title">JJaim: parts, rules, glyphs</title>
  <desc id="description">A reusable pixel part is imported twice at offsets (0, 0) and (8, 0) to compose one wider glyph. Colors distinguish placements, not source pixel values.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <path id="part" d="M0 0H64V64H48V16H0Z"/>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7" fill="none" stroke="#64748b" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1040" height="244" rx="20" fill="#0b1220"/>
  <rect x="16" y="16" width="1008" height="212" rx="12" fill="url(#grid)"/>

  <g font-family="ui-monospace, 'Liberation Mono', Consolas, monospace">
    <g font-size="12" font-weight="700" letter-spacing="1.8">
      <text x="48" y="43" fill="#6ee7c2">01 / PARTS</text>
      <text x="328" y="43" fill="#b4a3ff">02 / RULES</text>
      <text x="728" y="43" fill="#a5d7ff">03 / GLYPHS</text>
    </g>

    <g fill="#111d2e" stroke="#2a3a50">
      <rect x="48" y="65" width="200" height="132" rx="12"/>
      <rect x="328" y="65" width="300" height="132" rx="12"/>
      <rect x="728" y="65" width="264" height="132" rx="12"/>
    </g>

    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M268 131H307"/>
      <path d="M648 131H707"/>
    </g>

    <rect x="108" y="91" width="80" height="80" rx="6" fill="#0b1220" stroke="#26394b"/>
    <use href="#part" x="116" y="99" fill="#6ee7c2"/>

    <text x="350" y="96" fill="#94a3b8" font-size="12">SAME PART, TWO PLACEMENTS</text>
    <g font-size="16">
      <circle cx="354" cy="122" r="3" fill="#6ee7c2"/>
      <text x="369" y="127" fill="#6ee7c2">offset: [0, 0]</text>
      <circle cx="354" cy="151" r="3" fill="#b4a3ff"/>
      <text x="369" y="156" fill="#b4a3ff">offset: [8, 0]</text>
    </g>
    <text x="350" y="181" fill="#94a3b8" font-size="11">imports + indexed placement</text>

    <rect x="788" y="91" width="144" height="80" rx="6" fill="#0b1220" stroke="#26394b"/>
    <use href="#part" x="796" y="99" fill="#6ee7c2"/>
    <use href="#part" x="860" y="99" fill="#b4a3ff"/>
    <path d="M860 95V167" stroke="#e2e8f0" stroke-opacity="0.2" stroke-dasharray="3 4"/>

    <g fill="#94a3b8" font-size="11" letter-spacing="1.2">
      <text x="148" y="222" text-anchor="middle">EXTRACT</text>
      <text x="478" y="222" text-anchor="middle">REUSE + PLACE</text>
      <text x="860" y="222" text-anchor="middle">COMPOSE</text>
    </g>
  </g>
</svg>
