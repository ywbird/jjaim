    <path id="final" d="M3 10h10v1H3ZM3 11h10v1H3ZM11 12h2v1H11ZM11 13h2v1H11ZM11 14h2v1H11Z"/>
    <g id="composed"><use href="#initial"/><use href="#medial"/><use href="#final"/></g>
  </defs>
