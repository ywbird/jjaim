<svg xmlns="http://www.w3.org/2000/svg" width="800" height="236" viewBox="0 0 800 236" role="img" aria-labelledby="title description">
  <title id="title">JJaim — 각을 구성하는 세 부품</title>
  <desc id="description">실제 한글 예제의 initial_5[0], medial_2[0], final_0[0]을 같은 좌표에 겹쳐 hangul_syllables[1], U+AC01 각을 만듭니다. 각 픽셀 모양은 예제 PNG에서 가져왔습니다.</desc>
  <defs>
