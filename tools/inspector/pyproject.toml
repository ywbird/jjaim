[project]
name = "glyph-inspect"
version = "0.1.0"
description = "Declarative glyph composition inspector CLI"
requires-python = ">=3.11"
dependencies = ["pillow>=10"]

[project.scripts]
glyph-inspect = "glyph_inspect.cli:entry"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyph_inspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
